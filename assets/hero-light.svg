<line x1="494" x2="788" y1="152" y2="152" stroke="#e3e0d8" stroke-dasharray="3 4"/>
<g style="animation:logIn 7.5s 0s ease-out infinite"><text x="494" y="176" class="m" font-size="12.5"><tspan class="mu">09:00 </tspan><tspan class="ac">✓ </tspan><tspan class="ink">티켓 14건 → notion</tspan></text></g>
<g style="animation:logIn 7.5s 1.2s ease-out infinite"><text x="494" y="196" class="m" font-size="12.5"><tspan class="mu">09:05 </tspan><tspan class="ac">✓ </tspan><tspan class="ink">새 고시 2건 → telegram</tspan></text></g>
<g style="animation:logIn 7.5s 2.4s ease-out infinite"><text x="494" y="216" class="m" font-size="12.5"><tspan class="mu">09:10 </tspan><tspan class="ac">· </tspan><tspan class="ink">분류 대기 3건</tspan></text></g>
<text x="494" y="236" class="m ac" font-size="12.5">$ <tspan class="blink">▍</tspan></text>
