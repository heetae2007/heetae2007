<svg xmlns="http://www.w3.org/2000/svg" width="840" height="326" viewBox="0 0 840 326" role="img" aria-labelledby="t">
<title id="t">채희태 Heetae Chae. Cloud HIS 운영/개발자 @ ezcaretech. 병원 행정의 반복 업무를 코드로 옮기는 개발자입니다. 오른쪽 터미널에는 5분마다 도는 자동화 crontab과 실행 로그가 보이고, 아래로 심전도 라인이 흐릅니다.</title>
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'D2Coding',monospace}
.ink{fill:#1b1d22}.mu{fill:#6b7080}.ac{fill:#0a8f6a}
@keyframes trace{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes logIn{0%{opacity:0;transform:translateY(4px)}8%,88%{opacity:1;transform:none}100%{opacity:0}}
.trace{animation:trace 4.8s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="839" height="325" rx="16" fill="#fbfaf7" stroke="#e3e0d8"/>
<circle class="pulse" cx="46" cy="58" r="4" fill="#0a8f6a"/>
<text x="58" y="62" class="m mu" font-size="13">~/heetae2007</text>
<text x="40" y="118" class="s ink" font-size="42" font-weight="700" letter-spacing="-1">채희태<tspan dx="14" class="mu" font-size="19" font-weight="500" letter-spacing="0">Heetae Chae</tspan></text>
<text x="40" y="150" class="s mu" font-size="15">Cloud HIS 운영/개발자 @ ezcaretech</text>
<text x="40" y="196" class="s ink" font-size="18" font-weight="600">병원 행정의 반복 업무를</text>
<text x="40" y="222" class="s ink" font-size="18" font-weight="600">코드로 옮기는 개발자입니다.</text>
<rect x="476" y="34" width="330" height="222" rx="12" fill="#f2f0ea" stroke="#e3e0d8"/>
<text x="494" y="60" class="m mu" font-size="12">$ crontab -l</text>
<circle class="pulse" cx="760" cy="56" r="3.5" fill="#0a8f6a"/>
<text x="788" y="60" class="m ac" font-size="11" text-anchor="end">live</text>
<text x="494" y="94" class="m" font-size="12.5"><tspan class="mu">*/5 * * * *  </tspan><tspan class="ink">hira_watch.py</tspan></text>
<text x="494" y="115" class="m" font-size="12.5"><tspan class="mu">0 9 * * 1-5  </tspan><tspan class="ink">sheet_to_notion.gs</tspan></text>
